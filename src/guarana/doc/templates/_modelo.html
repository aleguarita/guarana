<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{app}}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body>

{% macro codigo(
    linguagem,
    codigo
)%}
<pre class='language-{{linguagem}} line-numbers'>
{% for linha in codigo %}<code>{{linha}}</code>
{% endfor %}</pre>
{% endmacro %}

<main class="conteudo">
    <nav class="menu">
        <header>
            <h1><a href="/">{% include "partials/logo.html" %}</a></h1>
        </header>

        RESTO DO MENU
    </nav>
    
    <section class="conteudo__principal">
        {% block conteudo %}{% endblock %}
    </section>
</main>
</body>
<script src="{{url_for('static', filename='js/prism.js')}}"></script>
</html>
