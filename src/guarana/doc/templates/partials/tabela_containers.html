<table class="tabela">
    <thead>
        <tr>
            <th>Container</th>
            <th>Classe</th>
            <th>Link</th>
            <th>Uso</th>
            <th>Versão</th>
        </tr>
    </thead>
    <tbody>
        {% for item in classe_css|sort(attribute="nome") %}
        {% if item.tipo == 'container' %}
        <tr>
            <td>{{item.container}}</td>
            <td><code>{{item.nome}}</code></td>
            <td><a href="{{item.pagina}}" class="ico">link</a></td>
            <td>{{macros.item_uso(item.uso)}}</td>
            <td>{{item.atualizada}}</td>
        </tr>
        {% endif %}
        {% endfor %}
    </tbody>
</table>
