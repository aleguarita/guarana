<table class="tabela">
    <thead>
        <tr>
            <th>Classe</th>
            <th>Tipo</th>
            <th>Container</th>
            <th>Documentação</th>
            <th>Uso</th>
            <th>Versão</th>
        </tr>
    </thead>
    <tbody>
        {% for item in classe_css|sort(attribute="nome") %}
        <tr>
            <td><code>{{item.nome}}</code></td>
            <td>{{item.tipo}}</td>
            <td>{{item.container}}</td>
            <!-- TODO: ícone no lugar do texto -->
            <td><a href="{{item.link}}">doc</a></td>
            <td>{{item.uso | safe}}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
